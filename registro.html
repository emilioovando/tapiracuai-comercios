<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="pwa-safety.js?v=20260804"></script>
  <title>Crear cuenta - Tapiracuai Comercios</title>
  <link rel="icon" type="image/jpeg" href="assets/tapiracuai-logo-oficial.jpg">
  <link rel="apple-touch-icon" href="assets/tapiracuai-logo-oficial.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
  <style>
    :root{--tds-green:#12685F;--tds-blue:#2374AB;--tds-orange:#FF6B35;--tds-bg:#F7FAF8;--tds-surface:#FFFFFF;--tds-text:#152A22;--tds-muted:#6E7A74;--tds-border:#D8E1E7;--tds-shadow:0 12px 32px rgba(21,42,34,.10);font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--tds-bg);color:var(--tds-text)}button,input{font:inherit}
    .auth-page{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,rgba(18,104,95,.92),rgba(35,116,171,.78)),url('assets/santani-portada-ciudad.jpg?v=1.2') center/cover fixed}
    .card{width:min(100%,480px);display:grid;gap:16px;padding:22px;border-radius:28px;background:rgba(255,255,255,.96);box-shadow:var(--tds-shadow)}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}.brand img{width:58px;height:58px;object-fit:contain;border-radius:18px;background:white;box-shadow:var(--tds-shadow);flex:0 0 auto}.brand div{min-width:0}.brand strong,.brand span{display:block;white-space:normal}.brand strong{font-weight:950}.brand span{color:var(--tds-muted);font-size:.9rem;font-weight:800}
    h1{margin:4px 0 0;font-size:1.75rem}p{margin:0;color:var(--tds-muted);font-weight:760}.form{display:grid;gap:13px}.field{display:grid;gap:7px}.field label{font-size:.92rem;font-weight:950}
    .field input{width:100%;min-height:54px;border:1px solid var(--tds-border);border-radius:18px;padding:0 14px;background:white;color:var(--tds-text);outline:none}.field input:focus{border-color:var(--tds-green);box-shadow:0 0 0 4px rgba(31,175,106,.12)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;border-radius:16px;padding:0 16px;font-weight:950;cursor:pointer;text-decoration:none}.btn.primary{background:var(--tds-green);color:white;box-shadow:0 10px 24px rgba(18,104,95,.18)}.btn.soft{background:#F7FAF8;color:var(--tds-green)}
    .role-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role-choice button{min-height:56px;border:1px solid var(--tds-border);border-radius:18px;background:white;color:var(--tds-muted);font-weight:950}.role-choice button.active{border-color:var(--tds-green);background:#E8F6EF;color:var(--tds-green)}
    .auth-message{padding:12px 14px;border-radius:18px;background:#EAF4FB;color:var(--tds-blue);font-weight:850;line-height:1.35}.auth-message.success{background:#E8F6EF;color:var(--tds-green)}.auth-message.error{background:#FFF0E9;color:var(--tds-orange)}.links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.links a{border:0;background:transparent;color:var(--tds-green);font-weight:950;text-decoration:none}.note{font-size:.86rem;text-align:center}
    .password-wrap{position:relative}.password-wrap input{padding-right:52px}.toggle-password{position:absolute;right:7px;bottom:7px;display:grid;width:42px;height:42px;place-items:center;border:0;border-radius:14px;background:#F7FAF8;color:var(--tds-green);cursor:pointer}.toggle-password .material-symbols-rounded{font-size:22px}
    @media(max-width:430px){.auth-page{padding:12px}.card{padding:18px;border-radius:24px}h1{font-size:1.5rem}.field input,.btn{min-height:56px}}
</style>
</head>
<body>
  <main class="auth-page">
    <section class="card">
      <div class="brand"><img src="assets/tapiracuai-logo-oficial.jpg" alt="Tapiracuai"><div><strong>Tapiracuai Comercios</strong><span>Cuenta unica</span></div></div>
      <h1>Crear cuenta</h1>
      <p>Elegí el tipo de cuenta. Después vas a completar el perfil correspondiente.</p>
      <div id="authMessage" hidden></div>
      <form id="registerForm" class="form" novalidate>
        <div class="role-choice">
          <button class="active" type="button" data-role="cliente"><span class="material-symbols-rounded">person</span> Cliente</button>
          <button type="button" data-role="comercio"><span class="material-symbols-rounded">storefront</span> Comercio</button>
        </div>
        <input id="role" type="hidden" value="cliente">
        <div class="field"><label>Correo</label><input id="email" type="email" autocomplete="email" placeholder="tu@email.com"></div>
        <div class="field password-wrap"><label>Contraseña</label><input id="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres, letras y números"><button class="toggle-password" type="button" data-toggle-password="password" aria-label="Ver u ocultar contraseña"><span class="material-symbols-rounded">visibility</span></button></div>
        <div class="field password-wrap"><label>Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeti tu contraseña"><button class="toggle-password" type="button" data-toggle-password="confirmPassword" aria-label="Ver u ocultar contraseña"><span class="material-symbols-rounded">visibility</span></button></div>
        <button id="registerSubmit" class="btn primary" type="submit"><span class="material-symbols-rounded">person_add</span><span>Crear cuenta</span></button>
      </form>
      <div class="links"><a href="login.html">Ya tengo cuenta</a><a class="btn soft" href="index.html">Volver al inicio</a></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-config.js?v=2.4"></script>
  <script src="supabase-client.js?v=3.4"></script>
  <script src="data-sync.js?v=1.6"></script>
  <script src="auth-service.js?v=2.2"></script>
  <script>
    document.querySelectorAll('[data-toggle-password]').forEach(function(btn){btn.onclick=function(){var input=document.getElementById(btn.dataset.togglePassword);if(!input)return;var show=input.type==='password';input.type=show?'text':'password';btn.querySelector('.material-symbols-rounded').textContent=show?'visibility_off':'visibility'}});
    function setRole(role){document.getElementById('role').value=role;document.querySelectorAll('[data-role]').forEach(function(b){b.classList.toggle('active',b.dataset.role===role)});document.getElementById('authMessage').hidden=true}
    document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){setRole(b.dataset.role)}});
    var registerBusy=false;
    document.getElementById('registerForm').onsubmit=async function(e){
      e.preventDefault();
      if(registerBusy)return;
      var role=document.getElementById('role').value;
      var button=document.getElementById('registerSubmit');
      var buttonText=button.querySelector('span:last-child');
      try{
        registerBusy=true;
        button.disabled=true;
        buttonText.textContent='Creando cuenta...';
        var user=await TapiracuaiAuth.register({role:role,email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,confirmPassword:document.getElementById('confirmPassword').value,businessData:{businessName:'Mi comercio',rubro:'General'}});
        if(user&&user.pendingConfirmation){
          TapiracuaiAuth.showMessage('#authMessage','Cuenta creada. Revis? tu correo, confirm? la cuenta y luego inici? sesi?n.','success');
          return;
        }
        TapiracuaiAuth.showMessage('#authMessage',role==='comercio'?'Cuenta creada correctamente. Complet? los datos de tu comercio.':'Cuenta creada. Complet? tu perfil.','success');
        setTimeout(function(){if(role==='comercio'){localStorage.setItem('tapiracuai_merchant_signup_notice','Cuenta creada correctamente. Complet? los datos de tu comercio.');window.scrollTo({top:0,behavior:'instant'});}location.href=TapiracuaiAuth.redirectForRole(user.role)},700);
      }catch(error){TapiracuaiAuth.showMessage('#authMessage',error.message,'error')}
      finally{
        registerBusy=false;
        button.disabled=false;
        buttonText.textContent='Crear cuenta';
      }
    };
  </script>
</body>
</html>
