<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <script src="pwa-safety.js?v=20260804"></script>
  <link rel="icon" type="image/jpeg" href="assets/tapiracuai-logo-oficial.jpg">
  <link rel="apple-touch-icon" href="assets/tapiracuai-logo-oficial.jpg">
  <title>Recuperar contraseña - Tapiracuai Comercios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
  <style>
    :root{--tds-green:#12685F;--tds-green-light:#1FAF6A;--tds-blue:#2374AB;--tds-orange:#FF6B35;--tds-yellow:#FFD166;--tds-bg:#F7FAF8;--tds-surface:#FFFFFF;--tds-text:#152A22;--tds-muted:#6E7A74;--tds-border:#D8E1E7;--tds-shadow:0 12px 32px rgba(21,42,34,.10);font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--tds-bg);color:var(--tds-text)}button,input,select{font:inherit}.auth-page{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,rgba(18,104,95,.92),rgba(35,116,171,.78)),url('assets/santani-portada-ciudad.jpg?v=1.2') center/cover fixed}.card{width:min(100%,480px);display:grid;gap:16px;padding:22px;border-radius:28px;background:rgba(255,255,255,.96);box-shadow:var(--tds-shadow)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:16px;background:white;box-shadow:var(--tds-shadow)}.brand strong,.brand span{display:block}.brand strong{font-weight:950}.brand span{color:var(--tds-muted);font-size:.9rem;font-weight:800}h1{margin:4px 0 0;font-size:1.75rem}p{margin:0;color:var(--tds-muted);font-weight:760}.form{display:grid;gap:13px}.field{display:grid;gap:7px}.field label{font-size:.92rem;font-weight:950}.field input,.field select{width:100%;min-height:54px;border:1px solid var(--tds-border);border-radius:18px;padding:0 14px;background:white;color:var(--tds-text);outline:none}.field input:focus,.field select:focus{border-color:var(--tds-green);box-shadow:0 0 0 4px rgba(31,175,106,.12)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;border-radius:16px;padding:0 16px;font-weight:950;cursor:pointer;text-decoration:none}.btn.primary{background:var(--tds-green);color:white;box-shadow:0 10px 24px rgba(18,104,95,.18)}.btn.soft{background:#F7FAF8;color:var(--tds-green)}.role-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role-choice button{min-height:56px;border:1px solid var(--tds-border);border-radius:18px;background:white;color:var(--tds-muted);font-weight:950}.role-choice button.active{border-color:var(--tds-green);background:#E8F6EF;color:var(--tds-green)}.hidden{display:none!important}.auth-message{padding:12px 14px;border-radius:18px;background:#EAF4FB;color:var(--tds-blue);font-weight:850;line-height:1.35}.auth-message.success{background:#E8F6EF;color:var(--tds-green)}.auth-message.error{background:#FFF0E9;color:var(--tds-orange)}.links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.links a,.link-btn{border:0;background:transparent;color:var(--tds-green);font-weight:950;text-decoration:none}.logout-row{display:none;gap:8px}.logout-row.active{display:flex}.note{font-size:.86rem;text-align:center}@media(max-width:430px){.auth-page{padding:12px}.card{padding:18px;border-radius:24px}h1{font-size:1.5rem}.field input,.field select,.btn{min-height:56px}}
</style>
</head>
<body>
<main class="auth-page"><section class="card">
  <div class="brand"><img src="assets/tapiracuai-logo-oficial.jpg" alt="Tapiracuai"><div><strong>Tapiracuai Comercios</strong><span>Cuenta única</span></div></div>
  <h1 id="recoveryTitle">Recuperar contraseña</h1>
  <p id="recoveryDescription">Ingresá tu correo para recibir un enlace de recuperación.</p>
  <div id="authMessage" role="status" aria-live="polite" hidden></div>
  <form id="recoverForm" class="form" novalidate>
    <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" required placeholder="tu@email.com"></div>
    <button id="sendRecoveryButton" class="btn primary" type="submit"><span class="material-symbols-rounded">mark_email_read</span>Recuperar contraseña</button>
  </form>
  <form id="newPasswordForm" class="form hidden" novalidate>
    <div class="field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required aria-describedby="passwordHelp"></div>
    <p id="passwordHelp" class="note">Mínimo 8 caracteres, una letra y un número.</p>
    <div class="field"><label for="confirmPassword">Confirmar nueva contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
    <button id="updatePasswordButton" class="btn primary" type="submit">Guardar nueva contraseña</button>
  </form>
  <div class="links"><a href="login.html">Volver a iniciar sesión</a><a class="btn soft" href="index.html">Volver al inicio</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js?v=2.4"></script>
<script src="supabase-client.js?v=3.4"></script>
<script src="auth-service.js?v=2.2"></script>
<script>
(function(){
  var recoverForm=document.getElementById('recoverForm');
  var passwordForm=document.getElementById('newPasswordForm');
  var sendButton=document.getElementById('sendRecoveryButton');
  var updateButton=document.getElementById('updatePasswordButton');
  var bridge=window.TapiracuaiSupabase;
  function message(text,type){TapiracuaiAuth.showMessage('#authMessage',text,type)}
  function renderRecoveryState(){
    if(!bridge||!bridge.available){message('No se pudo conectar con el servicio. Recargá la página para intentarlo nuevamente.','error');return}
    var state=bridge.getPasswordRecoveryState();
    recoverForm.classList.toggle('hidden',state.status==='pending'||state.status==='ready'||state.status==='complete');
    passwordForm.classList.toggle('hidden',state.status!=='ready');
    document.getElementById('recoveryTitle').textContent=state.status==='ready'?'Nueva contraseña':'Recuperar contraseña';
    document.getElementById('recoveryDescription').textContent=state.status==='pending'?'Verificando el enlace de recuperación…':state.status==='ready'?'Elegí una contraseña nueva para tu cuenta.':state.status==='complete'?'Ya podés iniciar sesión con tu nueva contraseña.':'Ingresá tu correo para recibir un enlace de recuperación.';
    if(state.status==='invalid')message(state.message,'error');
    else if(state.status==='ready')document.getElementById('authMessage').hidden=true;
    else if(state.status==='complete')message('Contraseña actualizada correctamente.','success');
  }
  document.addEventListener('tapiracuai:password-recovery',renderRecoveryState);
  renderRecoveryState();
  recoverForm.onsubmit=async function(e){
    e.preventDefault();
    if(sendButton.disabled)return;
    sendButton.disabled=true;
    try{
      await TapiracuaiAuth.recover(document.getElementById('email').value);
      message('Si existe una cuenta registrada con ese correo, recibirás un enlace para restablecer tu contraseña.','success');
    }catch(error){message(error.message||'No se pudo solicitar la recuperación. Intentá nuevamente.','error')}
    finally{sendButton.disabled=false}
  };
  passwordForm.onsubmit=async function(e){
    e.preventDefault();
    if(updateButton.disabled)return;
    updateButton.disabled=true;
    try{
      await TapiracuaiAuth.updatePassword(document.getElementById('newPassword').value,document.getElementById('confirmPassword').value);
      passwordForm.reset();
    }catch(error){message(error.message||'No se pudo actualizar la contraseña. Intentá nuevamente.','error')}
    finally{updateButton.disabled=false}
  };
})();
</script>
</body></html>
