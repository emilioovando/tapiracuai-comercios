[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=UTF-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/pwa-safety.js"
  [headers.values]
    Content-Type = "text/javascript; charset=UTF-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/sw.js"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/service-worker.js"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/privacidad/"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/eliminar-cuenta"
  to = "/eliminar-cuenta.html"
  status = 200

[[redirects]]
  from = "/eliminar-cuenta/"
  to = "/eliminar-cuenta.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
